[package]
name = "seiza-photoshop"
version = "0.5.5"
edition = "2024"
rust-version = "1.89"
description = "FITS and XISF codec bridge for native Photoshop file-format plug-ins"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
seiza-fits = "=0.2.2"
seiza-xisf = "=0.2.1"
quick-xml = "=0.41.0"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"

flate2 = "1"
lz4_flex = "0.14"
zstd = "0.13"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"

[profile.release]
lto = "thin"
