name: Build and test plugins

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codec:
    name: Codec (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --example make_fixtures

  plugins:
    name: Plugins (${{ matrix.platform }})
    # Never give pull-request code access to the SDK or its decryption key.
    if: github.event_name != 'pull_request' && github.repository == 'theatrus/xisf-photoshop'
    needs: codec
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows plugins leave this job unsigned; sign-windows publishes them.
          - platform: Windows-x64
            os: windows-latest
            sdk: win
            artifact: Seiza-Photoshop-Windows-x64-unsigned
            retention-days: 1
          # macOS bundles leave this job ad-hoc signed; sign-macos publishes them.
          - platform: macOS-universal
            os: macos-15
            sdk: mac
            artifact: Seiza-Photoshop-macOS-universal-unsigned
            retention-days: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt
      - name: Download encrypted SDK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download sdk-2026-v2 --pattern "adobe_photoshop_sdk_2026_${{ matrix.sdk }}_v2.zip.gpg" --dir .sdk
      - name: Ensure GnuPG on macOS
        if: runner.os == 'macOS'
        run: command -v gpg || brew install gnupg
      - name: Decrypt and verify SDK
        env:
          PHOTOSHOP_SDK_PASSPHRASE: ${{ secrets.PHOTOSHOP_SDK_PASSPHRASE }}
        run: python scripts/ci_sdk.py ${{ matrix.sdk }}
      - name: Build and test Windows plugins
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -PhotoshopSdk .sdk/extracted
      - name: Build and test optional Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1
          ./scripts/test-installer.ps1
      - name: Build and test universal macOS plugins
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh .sdk/extracted
      - name: Upload plugins
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/Seiza-Photoshop-${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ matrix.retention-days }}
      - name: Remove decrypted SDK
        if: always()
        run: python scripts/ci_sdk.py --clean

  sign-windows:
    name: Sign Windows plugins and installer
    # Azure Artifact Signing over GitHub OIDC: there is no signing secret in
    # this repository. `environment: signing` is load-bearing -- it is what puts
    # `:environment:signing` in the OIDC subject the Entra federated credential
    # matches on. Only validated plugins from the plugins job reach it, never
    # the SDK or pull-request code.
    if: github.event_name != 'pull_request' && github.repository == 'theatrus/xisf-photoshop'
    needs: plugins
    environment: signing
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download unsigned plugins
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: Seiza-Photoshop-Windows-x64-unsigned
          path: unsigned
      - name: Unpack plugins as data
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Expand-Archive -LiteralPath unsigned/Seiza-Photoshop-Windows-x64.zip -DestinationPath dist -Force
          foreach ($name in 'SeizaFITS.8bi', 'SeizaXISF.8bi') {
            if (-not (Test-Path -LiteralPath "dist/$name")) { throw "Missing $name in unsigned archive" }
          }
      - name: Authenticate to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The plugins are signed before the installer is built around them, so
      # both the portable ZIP and what the installer lays down carry a signature,
      # not just the installer's outer shell.
      - name: Sign plugins
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\SeizaFITS.8bi
            ${{ github.workspace }}\dist\SeizaXISF.8bi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify plugin signatures and repackage
        run: |
          foreach ($name in 'SeizaFITS.8bi', 'SeizaXISF.8bi') {
            $sig = Get-AuthenticodeSignature -LiteralPath "dist/$name"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'StackFoundry LLC') {
              throw "Invalid signature on $name: $($sig.Status) $($sig.SignerCertificate.Subject)"
            }
          }
          Remove-Item -LiteralPath dist/Seiza-Photoshop-Windows-x64.zip -ErrorAction Ignore
          Compress-Archive -Path dist\*.8bi,dist\README.md,dist\NOTICE,dist\LICENSE -DestinationPath dist\Seiza-Photoshop-Windows-x64.zip -Force
          $hash = (Get-FileHash -LiteralPath dist/Seiza-Photoshop-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("dist/Seiza-Photoshop-Windows-x64.zip.sha256", "$hash  Seiza-Photoshop-Windows-x64.zip`n")
      - name: Build installer around signed plugins
        run: ./scripts/build-installer.ps1
      - name: Sign installer
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\Seiza-Photoshop-Windows-x64-Setup-*.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # build-installer.ps1 hashed the installer before it was signed; redo it.
      - name: Verify installer signature and rehash
        run: |
          $installer = Get-Item dist/Seiza-Photoshop-Windows-x64-Setup-*.exe
          if ($installer.Count -ne 1) { throw 'Expected exactly one installer' }
          $sig = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'StackFoundry LLC') {
            throw "Invalid installer signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($installer.FullName).sha256", "$hash  $($installer.Name)`n")
          Write-Host "Signed $($installer.Name) as $($sig.SignerCertificate.Subject)"
      - name: Upload signed plugins
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Seiza-Photoshop-Windows-x64
          path: |
            dist/Seiza-Photoshop-Windows-x64.zip
            dist/Seiza-Photoshop-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload signed installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Seiza-Photoshop-Windows-x64-Installer
          path: |
            dist/Seiza-Photoshop-Windows-x64-Setup-*.exe
            dist/Seiza-Photoshop-Windows-x64-Setup-*.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  sign-macos:
    name: Sign and notarize macOS plugins
    # The signing environment holds the Developer ID certificate and the App
    # Store Connect key. Only validated bundles from the plugins job reach it,
    # never the SDK or pull-request code.
    if: github.event_name != 'pull_request' && github.repository == 'theatrus/xisf-photoshop'
    needs: plugins
    environment: signing
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download unsigned bundles
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: Seiza-Photoshop-macOS-universal-unsigned
          path: unsigned
      - name: Unpack bundles as data
        run: |
          mkdir -p dist
          ditto -x -k unsigned/Seiza-Photoshop-macOS-universal.zip dist
          test -d dist/macos/SeizaFITS.plugin
          test -d dist/macos/SeizaXISF.plugin
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_BUILD_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"

          certificate_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/seiza-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          # Select by name, never by thumbprint: the name survives renewals.
          certificate_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk -F'"' '/Developer ID Application/ { print $2; exit }'
          )"
          test -n "$certificate_identity"
          printf 'CERT_ID=%s\n' "$certificate_identity" >> "$GITHUB_ENV"
      - name: Sign, notarize, and staple bundles
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PRIVATE: ${{ secrets.APPLE_API_KEY_PRIVATE }}
        run: |
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_PRIVATE"

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_PRIVATE" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          APPLE_API_KEY_PATH="$key_path" bash scripts/sign-macos.sh dist/macos "$CERT_ID"
      - name: Package signed plugins
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/macos dist/Seiza-Photoshop-macOS-universal.zip
          (cd dist && shasum -a 256 Seiza-Photoshop-macOS-universal.zip > Seiza-Photoshop-macOS-universal.zip.sha256)
      - name: Upload signed plugins
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Seiza-Photoshop-macOS-universal
          path: |
            dist/Seiza-Photoshop-macOS-universal.zip
            dist/Seiza-Photoshop-macOS-universal.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Remove signing material
        if: always()
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          security delete-keychain "$RUNNER_TEMP/seiza-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
